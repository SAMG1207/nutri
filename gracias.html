<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>¡Gracias! · Jessica Luengo Nutrición</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Fuentes de marca -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="img/logo-color.png" />
    <!-- Estilos propios -->
    <link rel="stylesheet" href="style.css" />

    <style>
      .gracias-section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--crema);
        text-align: center;
        padding: 40px 20px;
      }
      .gracias-box {
        max-width: 560px;
      }
      .gracias-icono {
        width: 64px;
        margin-bottom: 24px;
      }
      .gracias-box h1 {
        font-size: 36px;
        margin-bottom: 18px;
      }
      .gracias-box p {
        font-family: "Caveat", cursive;
        font-weight: 600;
        font-size: 26px;
        color: var(--salvia-oscuro);
        max-width: 60ch;
        margin: 0 auto 32px;
      }
      .btn-gracias {
        background: #fdaa76;
        color: var(--tinta);
        font-weight: 600;
        border-radius: 3px;
        border: none;
        padding: 12px 28px;
        text-decoration: none;
        display: inline-block;
      }
      .btn-gracias:hover {
        background: #fb9a5c;
        color: var(--tinta);
      }
    </style>
  </head>
  <body>
    <section class="gracias-section">
      <div class="gracias-box">
        <img src="img/logo-color.png" alt="" class="gracias-icono" />
        <h1>¡Gracias por escribirme!</h1>
        <p>He recibido tu mensaje y te contactaré lo antes posible.</p>
        <a href="index.html" class="btn-gracias">Volver al inicio</a>
      </div>
    </section>
  </body>
</html>
